<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Poetry Transformer — Live</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    body { font-family: system-ui, Arial; margin: 2rem; }
    pre { background:#f7f7f7; padding:1rem; border-radius:6px; white-space:pre-wrap; }
    #status { margin-bottom:1rem; }
    button { padding:0.5rem 1rem; }
    #next-poem { font-size: 1.25rem; line-height: 1; padding: 0.4rem 0.85rem; }

    .languages { font-size: 0.9rem; font-weight: normal; color: #555; }

    /* Per-word spans and cycling highlight */
    .word { display: inline-block; padding: 0 2px; }

    /* Pulsing highlight */
    .cycling { background: #fff3a7; border-radius: 3px; animation: pulse 1.2s infinite ease-in-out; }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(255,243,167,0.95); }
      40% { box-shadow: 0 0 10px 6px rgba(255,243,167,0.35); }
      100% { box-shadow: 0 0 0 0 rgba(255,243,167,0); }
    }

    /* Screen-reader only element */
    .sr-only {
      position: absolute !important;
      height: 1px; width: 1px;
      overflow: hidden;
      clip: rect(1px, 1px, 1px, 1px);
      white-space: nowrap; /* added line */
      border: 0;
      padding: 0;
      margin: -1px;
    }
  </style>
</head>
<body>
  <h1>Poetry Transformer — Live</h1>
  <div id="status">Connecting...</div>
  <div>
    <button id="trigger">Trigger (Space)</button>
    <button id="next-poem" title="Next poem">→</button>
    <a href="/add.html">Add a poem</a>
  </div>
  <h2>Current Poem <span id="languages" class="languages"></span> <span id="phase" class="languages"></span></h2>
  <pre id="poem">(empty)</pre>

  <!-- Live region for screen readers: will announce cycling/snapshots -->
  <div id="sr-live" class="sr-only" aria-live="polite" aria-atomic="true"></div>

  <script>
    const statusEl = document.getElementById('status');
    const poemEl = document.getElementById('poem');
    const triggerBtn = document.getElementById('trigger');
    const nextBtn = document.getElementById('next-poem');
    const srLive = document.getElementById('sr-live');

    const base = window.location.origin;
    const BLOCK_HIGHLIGHT_MS = 1500;
    const wsProto = (location.protocol === 'https:') ? 'wss' : 'ws';
    const ws = new WebSocket(wsProto + '://' + location.host + '/ws');

    ws.onopen = () => { statusEl.textContent = 'Connected'; };
    ws.onclose = () => { statusEl.textContent = 'Disconnected'; };
    ws.onerror = (e) => { statusEl.textContent = 'WebSocket error'; console.error(e); };

    function escapeHtml(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    const languagesEl = document.getElementById('languages');
    const phaseEl = document.getElementById('phase');

    const PHASE_LABELS = {
      PHASE_1_WORD_BY_WORD: 'Phase 1 · word by word',
      PHASE_2_GROWING_BLOCKS: 'Phase 2 · short blocks',
      PHASE_3_ARRIVAL: 'Phase 3 · lines, then arrival',
      COMPLETE: 'Complete'
    };

    function updateLanguages(snapshot) {
      if (!snapshot) return;
      if (snapshot.source_language) {
        languagesEl.textContent = `${snapshot.source_language} → ${snapshot.target_language}`;
      }
      // phase_after is where the poem now stands, which is what the header
      // reports; the event's own phase describes the change it carried.
      const phase = snapshot.phase_after || snapshot.phase;
      if (phase) {
        phaseEl.textContent = PHASE_LABELS[phase] || phase;
      }
    }

    // Matches the engine's word indexing, which ignores empty tokens.
    function splitWords(stateText) {
      return (stateText || '').split(/\s+/).filter(Boolean);
    }

    // Build spans from the server's word slots. One slot per original word, so
    // data-index matches the engine's index even when a slot holds a multi-word
    // translation like "tell me".
    function renderFromSlots(words, separators) {
      const filled = [];
      words.forEach((word, index) => { if (word) filled.push(index); });

      return filled.map((index, position) => {
        const span = `<span class="word" data-index="${index}">${escapeHtml(words[index])}</span>`;
        if (position + 1 >= filled.length) return span;
        const separator = separators[filled[position + 1] - 1];
        return span + escapeHtml(separator === undefined ? ' ' : separator);
      }).join('');
    }

    // Fallback for events without slot data: split on whitespace. Indices can
    // drift from the engine's once a translation spans multiple words.
    function renderFromText(stateText) {
      let wordIndex = 0;
      return (stateText || '').split('\n').map(line => {
        return line.split(/\s+/).filter(Boolean).map(word => {
          const span = `<span class="word" data-index="${wordIndex}">${escapeHtml(word)}</span>`;
          wordIndex += 1;
          return span;
        }).join(' ');
      }).join('\n');
    }

    function renderState(stateText, highlight = null, srAnnouncement = null, words = null, separators = null) {
      poemEl.innerHTML = Array.isArray(words)
        ? renderFromSlots(words, separators || [])
        : renderFromText(stateText);

      // A block rewrite touches a span, a synonym cycle a single word.
      const indices = (Array.isArray(highlight) ? highlight : [highlight])
        .filter(Number.isFinite);

      if (indices.length) {
        indices.forEach(index => {
          const el = poemEl.querySelector(`.word[data-index="${index}"]`);
          if (el) el.classList.add('cycling');
        });
      } else {
        // ensure no cycling classes remain
        poemEl.querySelectorAll('.word.cycling').forEach(e => e.classList.remove('cycling'));
      }

      // Announce for screen readers if requested
      if (srAnnouncement) {
        // Small delay to ensure polite announcements are picked up
        srLive.textContent = '';
        setTimeout(() => { srLive.textContent = srAnnouncement; }, 50);
      }
    }

    ws.onmessage = (evt) => {
      try {
        const event = JSON.parse(evt.data);
        if (!event) return;

        updateLanguages(event.context_snapshot);

        // Prefer the server's slot list; fall back to splitting the text.
        const wordAt = (index) => Array.isArray(event.words)
          ? (event.words[index] || '')
          : (splitWords(event.new_state)[index] || '');

        // Intermediate synonym cycle events have `intermediate: true` and a context_snapshot.word_index
        if (event.intermediate && event.context_snapshot && typeof event.context_snapshot.word_index !== 'undefined') {
          const idx = event.context_snapshot.word_index;
          const sr = `Cycling word ${idx + 1}: ${wordAt(idx)}`;
          renderState(event.new_state, idx, sr, event.words, event.separators);
          return;
        }

        // A block rewrite from phase 2 or 3: flash the span that changed
        const snapshot = event.context_snapshot || {};
        if (event.new_state !== undefined && Number.isFinite(snapshot.block_start)) {
          const span = [];
          for (let i = snapshot.block_start; i < snapshot.block_end; i += 1) span.push(i);
          renderState(event.new_state, span, 'Block rewritten.', event.words, event.separators);
          setTimeout(() => {
            poemEl.querySelectorAll('.word.cycling').forEach(e => e.classList.remove('cycling'));
          }, BLOCK_HIGHLIGHT_MS);
          return;
        }

        // Normal final events: if we have a word index in context_snapshot, announce settled word
        if (event.new_state !== undefined) {
          let sr = null;
          if (typeof snapshot.word_index !== 'undefined') {
            const idx = snapshot.word_index;
            sr = `Word ${idx + 1} settled to ${wordAt(idx)}`;
          } else {
            sr = 'Poem updated.';
          }
          renderState(event.new_state, null, sr, event.words, event.separators);
        }

      } catch (err) { console.error('Invalid event', err); }
    };

    async function sendTrigger() {
      try {
        await fetch(base + '/trigger', { method: 'POST' });
      } catch (err) { console.error('Trigger failed', err); }
    }

    triggerBtn.addEventListener('click', sendTrigger);

    // Spacebar handling
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        sendTrigger();
      }
    });

    nextBtn.addEventListener('click', async () => {
      try {
        const response = await fetch(base + '/next_poem', { method: 'POST' });
        if (!response.ok) {
          const detail = await response.json().catch(() => ({}));
          statusEl.textContent = detail.detail || 'No other poems yet';
        }
      } catch (err) {
        console.error('Next poem failed', err);
      }
    });
  </script>
</body>
</html>
