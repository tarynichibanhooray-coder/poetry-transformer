<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Poetry Transformer — Poem</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    body { font-family: system-ui, Arial; margin: 2rem; max-width: 60rem; }
    nav { margin-bottom: 1.5rem; display: flex; gap: 1rem; }
    h1 { margin-bottom: 0.25rem; }
    .hint { color: #555; font-size: 0.9rem; }
    .arrow { color: #999; margin: 0 0.4rem; }
    form { display: grid; gap: 1rem; margin: 1.5rem 0 2rem; max-width: 42rem; }
    form label { display: grid; gap: 0.35rem; font-weight: 600; }
    input[type="text"], select, textarea {
      box-sizing: border-box; width: 100%; padding: 0.55rem; font: inherit;
      border: 1px solid #bbb; border-radius: 5px;
    }
    textarea { min-height: 9rem; resize: vertical; white-space: pre-wrap; }
    .form-actions button { padding: 0.5rem 1rem; font: inherit; }
    .stage { margin: 2.5rem 0; }
    .stage h2 { margin-bottom: 0.2rem; }
    .stage-list { list-style: none; padding: 0; }
    .stage-list li { border-top: 1px solid #ddd; padding: 1rem 0; }
    .stage-list li:last-child { border-bottom: 1px solid #ddd; }
    .reading-source, .reading-note { color: #666; font-size: 0.9rem; white-space: pre-wrap; }
    .reading-content { margin: 0.3rem 0; white-space: pre-wrap; }
    .reading-actions { display: flex; gap: 0.75rem; margin-top: 0.4rem; }
    .reading-actions button, details summary { color: #06c; cursor: pointer; }
    .reading-actions button { background: none; border: 0; padding: 0; font: inherit; }
    .reading-actions .danger { color: #b00020; }
    details { margin-top: 1rem; }
    .stage-editor { display: grid; gap: 0.5rem; max-width: 42rem; margin-top: 0.75rem; }
    .stage-editor textarea { min-height: 5rem; }
    .stage-editor .multiline-source { min-height: 8rem; }
    .empty { color: #888; font-style: italic; }
    #status { min-height: 1.4rem; }
    .err { color: #b00020; }
    .ok { color: #0a7d28; }
    .poem-controls { display: flex; gap: 1.25rem; align-items: center; margin-top: 0.6rem; }
    .poem-controls label { display: flex; gap: 0.4rem; align-items: center;
                           cursor: pointer; font-size: 0.9rem; }
    .poem-controls button { background: none; border: none; color: #06c;
                            cursor: pointer; padding: 0; font: inherit; font-size: 0.9rem; }
    .poem-controls button.danger { color: #b00020; }
    .poem-controls button:hover { text-decoration: underline; }
    .poem-controls button[disabled] { color: #bbb; cursor: default; text-decoration: none; }
  </style>
</head>
<body>
  <nav>
    <a href="/poems">&larr; All poems</a>
    <a href="/">Live view</a>
  </nav>

  <div id="status" aria-live="polite"></div>
  <div id="content"></div>

  <script>
    const statusEl = document.getElementById('status');
    const contentEl = document.getElementById('content');
    const poemId = Number(window.location.pathname.split('/').filter(Boolean).pop());
    let poemData = null;
    let languageData = null;
    const STAGES = [
      {
        key: 'words',
        heading: 'Stage 1 · words',
        blurb: 'Saved model results and authored readings of individual source words.',
        sourceLabel: 'Source word',
        contentLabel: 'Authored reading',
      },
      {
        key: 'phrases',
        heading: 'Stage 2 · phrases',
        blurb: 'Saved model results and authored readings of two- or three-word source scraps.',
        sourceLabel: 'Source scrap',
        contentLabel: 'Authored reading',
      },
      {
        key: 'lines',
        heading: 'Stage 3 · variations',
        blurb: 'Saved model results and authored full-poem variations.',
        sourceLabel: 'Source poem',
        contentLabel: 'Authored full-poem variation',
        sourceMultiline: true,
      },
    ];

    function element(tag, text, className) {
      const node = document.createElement(tag);
      if (text !== undefined && text !== null) node.textContent = text;
      if (className) node.className = className;
      return node;
    }

    function say(message, className) {
      statusEl.textContent = message;
      statusEl.className = className || '';
    }

    async function request(url, options) {
      const response = await fetch(url, options);
      if (!response.ok) {
        let detail = `${response.status} ${response.statusText}`;
        try {
          const body = await response.json();
          if (body.detail) detail = body.detail;
        } catch (ignored) {}
        throw new Error(detail);
      }
      return response.json();
    }

    async function load() {
      say('Loading…');
      try {
        [poemData, languageData] = await Promise.all([
          request(`/api/poems/${poemId}`),
          request('/languages'),
        ]);
        say('');
        render();
      } catch (error) {
        say(`Could not load this poem: ${error.message}`, 'err');
      }
    }

    async function setActive(active, checkbox) {
      checkbox.disabled = true;
      try {
        await request(`/api/poems/${poemId}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ active }),
        });
        await load();
        say(active ? 'Back in the rotation.' : 'Out of the rotation. The poem is kept.', 'ok');
      } catch (error) {
        checkbox.checked = !active;
        checkbox.disabled = false;
        say(`Could not change that: ${error.message}`, 'err');
      }
    }

    async function showNow(button) {
      button.disabled = true;
      try {
        await request(`/api/poems/${poemId}/live`, { method: 'POST' });
        await load();
        say('This poem is now on the screen.', 'ok');
      } catch (error) {
        button.disabled = false;
        say(`Could not show this poem: ${error.message}`, 'err');
      }
    }

    async function deletePoem(poem) {
      if (!window.confirm(`Delete "${poem.title || 'Untitled'}" for good?`)) return;
      try {
        await request(`/api/poems/${poemId}`, { method: 'DELETE' });
        window.location.href = '/poems';
      } catch (error) {
        say(`Could not delete: ${error.message}`, 'err');
      }
    }

    function controls(poem) {
      const controls = element('div', null, 'poem-controls');
      const label = document.createElement('label');
      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.checked = poem.active;
      checkbox.addEventListener('change', () => setActive(checkbox.checked, checkbox));
      label.append(checkbox, element('span', poem.active ? 'In the rotation' : 'Out of the rotation'));
      controls.appendChild(label);

      const show = element('button', 'Show this poem now');
      show.disabled = poemData.is_live;
      if (!show.disabled) show.addEventListener('click', () => showNow(show));
      controls.appendChild(show);

      const remove = element('button', 'Delete this poem', 'danger');
      remove.disabled = poemData.is_live;
      if (!remove.disabled) remove.addEventListener('click', () => deletePoem(poem));
      controls.appendChild(remove);
      return controls;
    }

    function field(labelText, control) {
      const label = document.createElement('label');
      label.append(element('span', labelText), control);
      return label;
    }

    function languageSelect(languages, selectedCode) {
      const select = document.createElement('select');
      for (const language of languages || []) {
        const option = document.createElement('option');
        option.value = language.code;
        option.textContent = language.name;
        option.selected = language.code === selectedCode;
        select.appendChild(option);
      }
      return select;
    }

    function editForm(poem) {
      const form = document.createElement('form');

      const title = document.createElement('input');
      title.type = 'text';
      title.value = poem.title || '';

      const sourceLanguage = languageSelect(
        languageData.source_languages,
        poem.source_language_code
      );
      const targetLanguage = languageSelect(
        languageData.target_languages,
        poem.target_language_code
      );

      const source = document.createElement('textarea');
      source.value = poem.raw_text || '';
      const finalTranslation = document.createElement('textarea');
      finalTranslation.value = poem.final_translation || '';

      const actions = element('div', null, 'form-actions');
      const save = element('button', 'Save poem');
      save.type = 'submit';
      actions.appendChild(save);

      form.append(
        field('Title', title),
        field('Original language', sourceLanguage),
        field('Original poem', source),
        field('Target language', targetLanguage),
        field('Chosen target / final translation (optional)', finalTranslation),
        actions
      );

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        save.disabled = true;
        try {
          const result = await request(`/api/poems/${poemId}`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              title: title.value,
              source_language_code: sourceLanguage.value,
              raw_text: source.value,
              target_language_code: targetLanguage.value,
              final_translation: finalTranslation.value,
            }),
          });
          await load();
          say(
            result.is_live
              ? 'Saved. The live poem restarted with these changes; reload the live page to see it.'
              : 'Saved.',
            'ok'
          );
        } catch (error) {
          save.disabled = false;
          say(`Could not save: ${error.message}`, 'err');
        }
      });
      return form;
    }

    function stageEditor(stage, values, onSave, onCancel) {
      const editor = element('div', null, 'stage-editor');
      const source = document.createElement(stage.sourceMultiline ? 'textarea' : 'input');
      if (!stage.sourceMultiline) source.type = 'text';
      if (stage.sourceMultiline) source.className = 'multiline-source';
      source.placeholder = stage.sourceLabel;
      source.value = values.source_text || '';

      const content = document.createElement('textarea');
      content.placeholder = stage.contentLabel;
      content.value = values.content || '';
      const note = document.createElement('input');
      note.type = 'text';
      note.placeholder = 'Note (optional)';
      note.value = values.note || '';

      const actions = element('div', null, 'reading-actions');
      const save = element('button', 'Save');
      save.type = 'button';
      save.addEventListener('click', async () => {
        if (!content.value.trim()) {
          say('A reading cannot be empty.', 'err');
          return;
        }
        save.disabled = true;
        try {
          await onSave({
            source_text: source.value,
            content: content.value,
            note: note.value,
          });
        } catch (error) {
          save.disabled = false;
          say(`Could not save reading: ${error.message}`, 'err');
        }
      });
      actions.appendChild(save);
      if (onCancel) {
        const cancel = element('button', 'Cancel');
        cancel.type = 'button';
        cancel.addEventListener('click', onCancel);
        actions.appendChild(cancel);
      }
      editor.append(source, content, note, actions);
      return editor;
    }

    function readingItem(stage, reading) {
      const item = document.createElement('li');
      const show = () => {
        const source = element('div', reading.source_text || '', 'reading-source');
        const content = element('div', reading.content, 'reading-content');
        const note = element('div', reading.note || '', 'reading-note');
        const origin = element(
          'div',
          reading.origin === 'api'
            ? (reading.edited ? 'Model result · edited' : 'Model result')
            : 'Authored by hand',
          'reading-note'
        );
        const actions = element('div', null, 'reading-actions');
        const edit = element('button', 'Edit');
        edit.addEventListener('click', () => {
          item.replaceChildren(stageEditor(stage, reading, async values => {
            await request(`/api/iterations/${reading.id}`, {
              method: 'PATCH',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(values),
            });
            await load();
            say('Reading saved.', 'ok');
          }, show));
        });
        const remove = element('button', 'Delete', 'danger');
        remove.addEventListener('click', async () => {
          if (!window.confirm('Delete this saved reading?')) return;
          try {
            await request(`/api/iterations/${reading.id}`, { method: 'DELETE' });
            await load();
            say('Reading deleted.', 'ok');
          } catch (error) {
            say(`Could not delete reading: ${error.message}`, 'err');
          }
        });
        actions.append(edit, remove);
        item.replaceChildren(origin, source, content, note, actions);
      };
      show();
      return item;
    }

    function stageSection(stage, readings) {
      const section = element('section', null, 'stage');
      section.append(element('h2', stage.heading), element('p', stage.blurb, 'hint'));
      if (readings.length) {
        const list = element('ol', null, 'stage-list');
        for (const reading of readings) list.appendChild(readingItem(stage, reading));
        section.appendChild(list);
      } else {
        section.appendChild(element('p', 'No readings saved.', 'empty'));
      }

      const addHeading = element('h3', `Add ${stage.contentLabel.toLowerCase()}`);
      addHeading.style.fontSize = '1rem';
      addHeading.style.margin = '1.25rem 0 0';
      section.appendChild(addHeading);
      section.appendChild(stageEditor(stage, {}, async values => {
        await request(`/api/poems/${poemId}/iterations`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ stage: stage.key, ...values }),
        });
        await load();
        say('Reading added.', 'ok');
      }));
      return section;
    }

    function render() {
      const poem = poemData.poem;
      document.title = `Poetry Transformer — ${poem.title || 'Untitled'}`;
      const header = document.createElement('header');
      header.appendChild(element('h1', poem.title || 'Untitled'));
      const languages = element('p', null, 'hint');
      languages.append(poem.source_language || '—', element('span', '→', 'arrow'), poem.target_language || '—');
      header.append(languages, controls(poem));

      contentEl.replaceChildren(header, editForm(poem), element(
        'p',
        'Every model result is saved here automatically and can be corrected or deleted. You can also add readings by hand.',
        'hint'
      ));
      for (const stage of STAGES) {
        contentEl.appendChild(stageSection(stage, poemData.stages[stage.key] || []));
      }
    }

    load();
  </script>
</body>
</html>
